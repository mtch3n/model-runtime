[package]
name = "model-runtime"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
gliner2-rs = "0.9"
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["openmp"] }
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
